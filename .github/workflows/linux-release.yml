name: Linux release verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase commit SHA containing the composed runtime and capacity changes
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOAMD64: v1
  CGO_ENABLED: '0'
  FIXTURE: linux-release-v1
  BOG_REPOSITORY: tflynn3/bog
  TOOLING_REVISION: abefdb5dcdc1f8bbbecdc9c0cc7ab39b309a87db
  PARITY_TOOLING_REVISION: 447e996525352ef5dd44d5eae1de09b4cbd53d53
  CONTROL_SCOPE_TOOLING_REVISION: 268195aae3f25aeac21efa818f3215b29ede406a
  CAPACITY_VALIDATION_REVISION: e53a856eafbd3f4101757372c57c4a4fd8ea38bc
  ADMISSION_TOOLING_REVISION: 304749df78fe3dfaa75ce411efa34708269af659
  REVISION: ${{ inputs.revision }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, runner_arch: X64, machine: x86_64}
          - {arch: arm64, runner: ubuntu-24.04-arm, runner_arch: ARM64, machine: aarch64}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - name: Record fixture and check revision input
        run: |
          EVIDENCE="$RUNNER_TEMP/bog-release-evidence"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\nBINARY=%s\n' "$EVIDENCE" "$RUNNER_TEMP/bog-release-candidate" >> "$GITHUB_ENV"
          {
            printf 'revision=%q\nfixture=%s\n' "$REVISION" "$FIXTURE"
            uname -a
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            nproc
            findmnt --target "$RUNNER_TEMP"
            findmnt --target /sys/fs/cgroup
            cat /proc/self/cgroup
          } | tee "$EVIDENCE/run.txt"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full lowercase commit SHA" | tee -a "$EVIDENCE/run.txt"; exit 1; }
          [[ "$RUNNER_OS" == Linux && "$(uname -s)" == Linux && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" && "$(uname -m)" == "$EXPECTED_MACHINE" ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verifiers
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ env.TOOLING_REVISION }}
          path: gate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ env.ADMISSION_TOOLING_REVISION }}
          path: admission
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ env.PARITY_TOOLING_REVISION }}
          path: parity-gate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ env.CAPACITY_VALIDATION_REVISION }}
          path: capacity-validation
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ env.CONTROL_SCOPE_TOOLING_REVISION }}
          path: control-scope
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOG_REPOSITORY }}
          ref: ${{ inputs.revision }}
          path: candidate
          persist-credentials: false

      - name: Record fixture configuration
        run: |
          cp admission/verify/release/README.md "$EVIDENCE/fixture.md"
          cp candidate/verify/linux/README.md "$EVIDENCE/durability-fixture.md"
          cp capacity-validation/bench/retained-history/README.md "$EVIDENCE/capacity-fixture.md"
          cp verifiers/release/{fixed-budget,restored-parity,capacity-wire-restart,selected-tail-probe,capacity-control-scope}.patch "$EVIDENCE/"
          cp verifiers/release/{admission/fixed-boundaries.patch,selected_tail_linux_test.go} "$EVIDENCE/"
          printf 'tooling_revision=%s\nverifier_revision=%s\n' "$(git -C gate rev-parse HEAD)" \
            "$(git -C verifiers rev-parse HEAD)" | tee -a "$EVIDENCE/run.txt"
          [[ "$(git -C verifiers rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C gate rev-parse HEAD)" == "$TOOLING_REVISION" ]]
          admission_revision=$(git -C admission rev-parse HEAD)
          printf 'admission_tooling_revision=%s\n' "$admission_revision" | tee -a "$EVIDENCE/run.txt"
          [[ "$admission_revision" == "$ADMISSION_TOOLING_REVISION" ]]
          validation_revision=$(git -C capacity-validation rev-parse HEAD)
          printf 'capacity_tooling_revision=%s\ncapacity_validation_revision=%s\n' \
            "$validation_revision" "$validation_revision" | tee -a "$EVIDENCE/run.txt"
          [[ "$validation_revision" == "$CAPACITY_VALIDATION_REVISION" ]]
          parity_revision=$(git -C parity-gate rev-parse HEAD)
          printf 'parity_tooling_revision=%s\n' "$parity_revision" | tee -a "$EVIDENCE/run.txt"
          [[ "$parity_revision" == "$PARITY_TOOLING_REVISION" ]]
          [[ -z "$(git -C parity-gate status --porcelain)" ]]
          control_scope_revision=$(git -C control-scope rev-parse HEAD)
          printf 'control_scope_tooling_revision=%s\n' "$control_scope_revision" | tee -a "$EVIDENCE/run.txt"
          [[ "$control_scope_revision" == "$CONTROL_SCOPE_TOOLING_REVISION" ]]
          git -C parity-gate apply "$GITHUB_WORKSPACE/verifiers/release/selected-tail-probe.patch"
          cp verifiers/release/selected_tail_linux_test.go parity-gate/verify/release/
          git -C gate apply --unidiff-zero "$GITHUB_WORKSPACE"/verifiers/release/{fixed-budget,restored-parity}.patch
          git -C admission apply --unidiff-zero "$GITHUB_WORKSPACE/verifiers/release/admission/fixed-boundaries.patch"
          git -C capacity-validation apply --unidiff-zero "$GITHUB_WORKSPACE"/verifiers/release/capacity-wire-restart.patch
          git -C control-scope apply --unidiff-zero "$GITHUB_WORKSPACE"/verifiers/release/capacity-control-scope.patch

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build pinned candidate
        id: build
        working-directory: candidate
        timeout-minutes: 6
        run: |
          {
            head=$(git rev-parse HEAD)
            printf 'HEAD=%s\n' "$head"
            [[ "$head" == "$REVISION" ]]
            [[ -z "$(git status --porcelain)" ]]
            go version
            [[ "$(go env GOVERSION GOOS GOARCH GOTOOLCHAIN CGO_ENABLED)" == "$(printf 'go1.27.0\nlinux\n%s\nlocal\n0' "$RELEASE_ARCH")" ]]
            go build -trimpath -buildvcs=true -o "$BINARY" ./cmd/bog
            go version -m "$BINARY" | tee "$EVIDENCE/build-info.txt"
            grep -Eq "^[[:space:]]+build[[:space:]]+vcs.revision=$REVISION$" "$EVIDENCE/build-info.txt"
            grep -Eq '^[[:space:]]+build[[:space:]]+vcs.modified=false$' "$EVIDENCE/build-info.txt"
            grep -Eq "^[[:space:]]+build[[:space:]]+GOARCH=$RELEASE_ARCH$" "$EVIDENCE/build-info.txt"
            sha256sum "$BINARY" | tee "$EVIDENCE/binary.sha256"
            read -r digest _ < "$EVIDENCE/binary.sha256"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf 'binary_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$EVIDENCE/build.log"

      - name: Check pinned capacity proof and consumer fixtures
        id: capacity-fixtures
        working-directory: capacity-validation
        timeout-minutes: 4
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -count=1 -v ./verify/capacityevidence ./bench/retained-history ./verify/release \
            2>&1 | tee "$EVIDENCE/capacity-fixture-tests.log"

      - name: Run release evidence producers
        if: steps.build.outcome == 'success'
        timeout-minutes: 48
        run: |
          record() {
            local name=$1 status=$2
            printf '%s revision=%s exit=%d\n' "$name" "$REVISION" "$status" | tee -a "$EVIDENCE/producers.txt"
          }
          common=(-binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE")
          unset BOG_CAPACITY_CONTROL
          admission() (
            cd admission || exit
            timeout --kill-after=5s 2m go run ./verify/release "${common[@]}" -report "$EVIDENCE/admission.json"
          )
          durability() (
            local parent producer status=0 cleanup_status=0
            producer="$RUNNER_TEMP/bog-durability-producer"
            (cd candidate && go build -trimpath -o "$producer" ./verify/linux) || exit
            parent=$(mktemp -d "$RUNNER_TEMP/bog-durability.XXXXXXXX") || exit
            TMPDIR="$parent" timeout --kill-after=5s 15m "$producer" "${common[@]}" \
              -report "$EVIDENCE/durability.json" || status=$?
            python3 -B verifiers/release_gate.py record-cleanup "$BINARY" "$REVISION" "$FIXTURE" \
              "$EVIDENCE" --fixture-parent "$parent" || cleanup_status=$?
            if (( status != 0 )); then exit "$status"; fi
            exit "$cleanup_status"
          )
          capacity_control_scope() (
            cd control-scope || exit
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            events="$EVIDENCE/capacity-control-scope-events.jsonl"
            timeout --kill-after=5s 3m go test -json -count=1 -run '^TestReleaseCapacityControlScope$' ./verify/release |
              tee "$events" || exit
            jq -es '
              [.[] | select(.Action == "pass" and .Package == "bog/verify/release") | .Test] as $passed |
              ("TestReleaseCapacityControlScope" | IN($passed[])) and
              ("TestReleaseCapacityControlScope/loopback_with_opt_in" | IN($passed[]))
            ' "$events" >/dev/null ||
              { echo "TestReleaseCapacityControlScope did not pass with opted-in loopback publication."; exit 1; }
          )
          capacity() (
            capacity_control_scope 2>&1 | tee "$EVIDENCE/capacity_control_scope.log" || exit
            python3 -B verifiers/release_gate.py control "$BINARY" "$REVISION" "$FIXTURE" "$EVIDENCE" \
              --require-replacement-restart --require-control-scope \
              2>&1 | tee "$EVIDENCE/control.log" || exit
            case "$(jq -er '.cases.capacity_control.status' "$EVIDENCE/control.json")" in
              skip) echo "The composed runtime requires loopback compaction control. See control.json."; exit 1 ;;
              pass)
                jq -e '.cases.capacity_control.evidence.environment_opt_in == true' "$EVIDENCE/control.json" >/dev/null ||
                  { echo "Strict live capacity requires BOG_CAPACITY_CONTROL=1 on loopback."; exit 1; }
                ;;
              *) exit 1 ;;
            esac
            cd capacity-validation || exit
            work=$(mktemp -d "$RUNNER_TEMP/bog-capacity.XXXXXXXX") || exit
            producer="$RUNNER_TEMP/bog-capacity-producer"
            cleanup() {
              local status=$?
              if rmdir -- "$work"; then
                echo "Capacity fixture root cleanup verified." | tee -a "$EVIDENCE/capacity-runner.txt"
              else
                {
                  echo "Capacity fixture root was not empty on producer exit."
                  ls -la -- "$work"
                } >> "$EVIDENCE/capacity-runner.txt" 2>&1
                rm -rf -- "$work"
                (( status != 0 )) || status=1
              fi
              exit "$status"
            }
            trap cleanup EXIT
            go build -trimpath -o "$producer" ./bench/retained-history || exit
            budget=$(PYTHONPATH="$GITHUB_WORKSPACE/verifiers" python3 -B -c \
              'from release_gate import CAPACITY_WORK_BUDGET; print(CAPACITY_WORK_BUDGET)') || exit
            "$producer" -help > "$EVIDENCE/capacity-help.txt" 2>&1 || exit
            budget_flags=()
            if grep -Eq '^[[:blank:]]*-query-work-budget([[:blank:]=]|$)' "$EVIDENCE/capacity-help.txt"; then
              budget_flags=(-query-work-budget "$budget")
            fi
            sudo -n systemd-run --quiet --wait --pipe --collect --expand-environment=no \
              --uid="$(id -u)" --gid="$(id -g)" -p 'Delegate=memory io' -p DelegateSubgroup=runner \
              -p RuntimeMaxSec=24min -p TimeoutStopSec=10s \
              /bin/bash -euo pipefail -c '
                work=$1 evidence=$2 producer=$3
                shift 3
                read -r unified </proc/self/cgroup
                [[ "$unified" == 0::/*/runner ]]
                group="/sys/fs/cgroup${unified#0::}"
                parent="${group%/*}"
                printf "+memory +io\n" > "$parent/cgroup.subtree_control"
                {
                  printf "capacity_mode=live\ncapacity_cgroup=%s\ncapacity_work_dir=%s\n" "$parent" "$work"
                  cat "$parent/cgroup.controllers" "$parent/cgroup.subtree_control"
                  for setting in memory.max memory.swap.max io.max; do
                    printf "%s:\n" "$setting"
                    cat "$parent/$setting"
                  done
                  findmnt --target "$work"
                  df -h "$work"
                } | tee "$evidence/capacity-runner.txt"
                exec "$producer" "$@" -mode live -cgroup-parent "$parent" \
                  -work-dir "$work" -report "$evidence/capacity.json"
              ' capacity "$work" "$EVIDENCE" "$producer" "${common[@]}" "${budget_flags[@]}" || exit
          )
          parity() (
            unset BOG_RELEASE_OPERATOR
            if [[ -d candidate/cmd/bog-verify ]]; then
              export BOG_RELEASE_OPERATOR="$RUNNER_TEMP/bog-release-operator"
              (cd candidate && go build -trimpath -o "$BOG_RELEASE_OPERATOR" ./cmd/bog-verify) || exit
            fi
            export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
            (
              cd parity-gate || exit
              export BOG_RELEASE_PARITY_REPORT="$EVIDENCE/parity.json"
              timeout --kill-after=5s 3m go test -json -count=1 -run '^TestReleaseRestoredParity$' ./verify/release
            ) | tee "$EVIDENCE/parity-events.jsonl" || exit
            jq -es 'any(.[]; .Action == "pass" and .Package == "bog/verify/release" and
              .Test == "TestReleaseRestoredParity")' "$EVIDENCE/parity-events.jsonl" >/dev/null ||
              { echo "TestReleaseRestoredParity did not report a passing test event."; exit 1; }
            [[ -s "$EVIDENCE/parity.json" ]] || { echo "Combined parity report is missing."; exit 1; }

            (
              cd gate || exit
              export BOG_RELEASE_PARITY_REPORT="$EVIDENCE/supplemental-parity.json"
              timeout --kill-after=5s 3m go test -json -count=1 -run '^TestReleaseRestoredParity$' ./verify/release
            ) | tee "$EVIDENCE/supplemental-parity-events.jsonl" || exit
            jq -es 'any(.[]; .Action == "pass" and .Package == "bog/verify/release" and
              .Test == "TestReleaseRestoredParity")' "$EVIDENCE/supplemental-parity-events.jsonl" >/dev/null || exit

            local helper="$RUNNER_TEMP/bog-restore-fixture"
            if jq -e '.cases.tail_only_two_cycle_parity.status == "pass"' "$EVIDENCE/parity.json" >/dev/null; then
              (
                cd parity-gate || exit
                source=$(mktemp -d ./restore-fixture.XXXXXXXX) || exit
                trap 'rm -rf "$source"' EXIT
                cp "$GITHUB_WORKSPACE/verifiers/release/restore_fixture.go" "$source/main.go" || exit
                go build -trimpath -o "$helper" "$source"
              ) || exit
            fi
            timeout --kill-after=5s 90s python3 -B verifiers/release_gate.py record-restore-cycles \
              "$BINARY" "$REVISION" "$FIXTURE" "$EVIDENCE" --restore-helper "$helper" || exit
          )
          failed=0
          for name in admission durability capacity parity; do
            status=0
            "$name" 2>&1 | tee "$EVIDENCE/$name.log" || status=$?
            record "$name" "$status"
            if (( status != 0 )); then failed=1; fi
          done
          exit "$failed"

      - name: Race-test release verifier lifecycle
        id: architecture-and-lifecycle
        if: always() && steps.build.outcome == 'success'
        working-directory: gate
        timeout-minutes: 5
        env:
          CGO_ENABLED: '1'
        run: |
          {
            (cd ../candidate && go test -race -count=1 ./internal/archtest ./verify/linux) || exit 1
            (cd ../admission && go test -race -count=1 ./verify/release -run 'BudgetWalk|FixedBudgetWire') || exit 1
            (cd ../parity-gate && go test -race -count=1 ./verify/release) || exit 1
            go test -race -count=1 ./verify/release ./verify/query-model
          } 2>&1 | tee "$EVIDENCE/verifier-race.log"

      - name: Validate reports and candidate identity
        if: >-
          always() && steps.build.outcome == 'success' && steps.capacity-fixtures.outcome == 'success' &&
          steps.architecture-and-lifecycle.outcome == 'success'
        working-directory: capacity-validation
        env:
          PINNED_BINARY_SHA256: ${{ steps.build.outputs.binary_sha256 }}
        timeout-minutes: 3
        run: |
          {
            failed=0
            sha256sum --check "$EVIDENCE/binary.sha256" || failed=1
            BOG_RELEASE_REQUIRE_RETARGET=1 go run ./verify/release validate -require-cutover -binary "$BINARY" -revision "$REVISION" -fixture "$FIXTURE" \
              -admission "$EVIDENCE/admission.json" -durability "$EVIDENCE/durability.json" \
              -capacity "$EVIDENCE/capacity.json" -parity "$EVIDENCE/parity.json" || failed=1
            (
              cd ../parity-gate || exit
              export BOG_RELEASE_BINARY="$BINARY" BOG_RELEASE_REVISION="$REVISION" BOG_RELEASE_FIXTURE="$FIXTURE"
              export BOG_RELEASE_VALIDATE_PARITY="$EVIDENCE/parity.json"
              go test -json -count=1 -run '^TestValidateNativeSelectedTailParity$' ./verify/release
            ) | tee "$EVIDENCE/parity-validation-events.jsonl" || failed=1
            jq -es 'any(.[]; .Action == "pass" and .Package == "bog/verify/release" and
              .Test == "TestValidateNativeSelectedTailParity")' "$EVIDENCE/parity-validation-events.jsonl" >/dev/null || failed=1
            go run ./bench/retained-history -validate-cutover "$EVIDENCE/capacity.json" || failed=1
            if (( failed != 0 )); then exit "$failed"; fi
            python3 -B "$GITHUB_WORKSPACE/verifiers/release_gate.py" validate \
              "$BINARY" "$REVISION" "$FIXTURE" "$EVIDENCE" --arch "$RELEASE_ARCH" \
              --binary-sha256 "$PINNED_BINARY_SHA256" \
              --parity-gate-revision "$(git -C ../parity-gate rev-parse HEAD)" \
              --verifier-revision "$GITHUB_SHA" \
              --capacity-validation-revision "$CAPACITY_VALIDATION_REVISION" \
              --require-fixture-root-cleanup --require-fixed-boundaries --require-backfill-timelines \
              --require-capacity-observations --require-replacement-restart --require-control-scope
          } 2>&1 | tee "$EVIDENCE/validation.log"

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/bog-release-evidence
          if-no-files-found: error

  qualify:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-release-evidence-*
          path: evidence
      - name: Require both native qualifications
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          [[ "$MATRIX_RESULT" == success ]]
          amd64_dir=evidence/linux-release-evidence-amd64
          arm64_dir=evidence/linux-release-evidence-arm64
          amd64=$(cat "$amd64_dir/qualified.json")
          arm64=$(cat "$arm64_dir/qualified.json")
          read -r amd64_digest _ < "$amd64_dir/binary.sha256"
          read -r arm64_digest _ < "$arm64_dir/binary.sha256"
          jq -en --argjson amd64 "$amd64" --argjson arm64 "$arm64" \
            --arg amd64_digest "$amd64_digest" --arg arm64_digest "$arm64_digest" \
            --arg revision "$REVISION" --arg fixture "$FIXTURE" --arg gate "$PARITY_TOOLING_REVISION" \
            --arg verifier "$GITHUB_SHA" \
            --arg capacity_validation "$CAPACITY_VALIDATION_REVISION" '
              if $amd64.arch == "amd64" and $arm64.arch == "arm64" and
              ([$amd64, $arm64] | all(.schema_version == 1 and .current_observations == true and
                .revision == $revision and .fixture == $fixture and .parity_gate_revision == $gate and
                .verifier_revision == $verifier and
                .post_restore_ack_crash == true and .writable_restore_cycles == true and .tail_only_two_cycle_parity == true and
                .replacement_restart == true and .control_scope == true and
                .capacity_validation_revision == $capacity_validation and
                (.binary_sha256 | test("^[0-9a-f]{64}$")))) and
              $amd64.binary_sha256 == $amd64_digest and $arm64.binary_sha256 == $arm64_digest and
              $amd64_digest != $arm64_digest then
                {revision: $revision, fixture: $fixture, verifier_revision: $verifier, parity_gate_revision: $gate,
                  capacity_validation_revision: $capacity_validation, control_scope: true, writable_restore_cycles: true,
                  tail_only_two_cycle_parity: true,
                  binary_sha256: {amd64: $amd64_digest, arm64: $arm64_digest}}
              else error("native qualification identities or verdicts did not match") end'
